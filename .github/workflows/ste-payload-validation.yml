name: ste-payload-validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ste-payload-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check STE delivery payload
        run: bash scripts/check-ste-payload.sh
